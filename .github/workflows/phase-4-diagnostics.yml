name: LSP-P3 Canonical Diagnostics

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -r requirements-ci.txt
      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in sorted(Path("schemas/lsp").glob("*.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(path)
          PY
      - name: Diagnostic tests
        run: pytest tests/diagnostics
      - name: Publication tests
        run: pytest tests/publication
      - name: Privacy tests
        run: pytest tests/privacy
      - name: Incremental runtime tests
        run: pytest tests/analysis tests/concurrency tests/runtime
      - name: Security tests
        run: pytest tests/security
      - name: Architecture tests
        run: pytest tests/architecture
      - name: Full suite
        if: github.event_name != 'pull_request'
        run: |
          pytest \
            --cov=l9_debt_lsp \
            --cov-report=term-missing \
            --cov-fail-under=75
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Capabilities
        run: l9-debt-lsp-contracts capabilities
