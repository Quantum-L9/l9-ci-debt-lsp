[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "l9-ci-debt-lsp"
version = "1.0.0"
description = "Offline-first LSP serving immutable Quantum-L9 debt-defense packs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Quantum-L9" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0,<7",
  "pygls>=1.3,<2",
  "lsprotocol>=2023.0.1,<2024",
  "cryptography>=43,<46",
  "httpx>=0.27,<1"
]
[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.6,<1"
]
[project.scripts]
l9-debt-lsp = "l9_debt_lsp.server:main"
l9-debt-lsp-contracts = "l9_debt_lsp.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/l9_debt_lsp"]
[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so the test-support package
# (`tests.fixtures.*`) imports under a bare `pytest` invocation, not only under
# `python -m pytest`. CI calls `pytest` directly, so without this the fixture
# imports fail at collection time.
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
# Ruff is configured in ruff.toml (single source of truth). A [tool.ruff]
# table here would be ignored whenever ruff.toml is present, so it is kept out
# of pyproject.toml deliberately to avoid silent divergence.
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["l9_debt_lsp"]
